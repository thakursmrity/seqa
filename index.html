<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seqa | Prospect brief agent by Sequor AI</title>
  <meta name="description" content="Seqa is an AI agent that helps you find the right prospects and write personal outreach. Being built in public.">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #393839;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main { max-width: 560px; text-align: center; }
    .badge {
      display: inline-block;
      background: #EEEAFD;
      color: #5B2FE0;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    h1 { font-size: 44px; color: #5B2FE0; margin-bottom: 12px; }
    p { font-size: 18px; line-height: 1.6; margin-bottom: 28px; }
    a.btn {
      display: inline-block;
      background: #5B2FE0;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      padding: 12px 24px;
      border-radius: 8px;
    }
    a.btn:hover { background: #4a22c2; }
    footer { margin-top: 36px; font-size: 14px; color: #888780; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Being built in public</span>
    <h1>Seqa</h1>
    <p>Tell Seqa what you sell. It finds the right companies, explains why each one matters, and drafts personal emails for you to edit and send.</p>
    <a class="btn" href="https://sequorai.com" target="_blank" rel="noopener noreferrer">Follow the build</a>

</html>
